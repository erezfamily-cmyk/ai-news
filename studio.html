<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Pulse — סטודיו פוסטים</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0b0e15;
      --surface: #111520;
      --card: rgba(255,255,255,0.035);
      --border: rgba(255,255,255,0.07);
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #60a5fa;
      --green: #25d366;
      --font-body: 'Assistant', sans-serif;
      --radius: 12px;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 800px;
      padding: 40px 20px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      text-align: center;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #e2e8f0, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    textarea, input[type="text"], input[type="password"], select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 16px;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(96,165,250,0.2);
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    button:hover {
      background: #3b82f6;
      color: #fff;
    }
    .btn-wa {
      background: var(--green);
      color: #fff;
    }
    .btn-wa:hover {
      background: #1ebc5c;
    }
    .preview-box {
      background: #e5ddd5;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }
    .msg-bubble {
      background: #ffffff;
      color: #111;
      padding: 12px 16px;
      border-radius: 12px;
      border-top-right-radius: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .loader {
      display: none;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    select option {
      background: #111520;
      color: #e2e8f0;
    }
    .settings-panel {
      display: none;
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }
    
    /* מגירת ארכיון צידית */
    .archive-drawer {
      position: fixed;
      top: 0;
      left: -400px;
      width: 400px;
      max-width: 100%;
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
      z-index: 1000;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .archive-drawer.open {
      left: 0;
    }
    .archive-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.01);
    }
    .archive-header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .archive-close-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }
    .archive-close-btn:hover {
      background: rgba(255,255,255,0.05);
      color: #fff;
    }
    .archive-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .archive-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .archive-item:hover {
      border-color: rgba(96,165,250,0.4);
      transform: translateY(-2px);
    }
    .archive-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .archive-item-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      margin-bottom: 12px;
      color: #cbd5e1;
    }
    .archive-item-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .archive-item-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .archive-item-actions button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .archive-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 998;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .archive-overlay.show {
      display: block;
      opacity: 1;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-badge.sent {
      background: rgba(37,211,102,0.15);
      color: #25d366;
    }
    .status-badge.draft {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      z-index: 1100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      animation: fadeInUp 0.3s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-bubble[contenteditable="true"] {
      outline: none;
      border: 1px dashed rgba(255,255,255,0.15);
      cursor: text;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .msg-bubble[contenteditable="true"]:focus {
      border: 1px solid var(--accent);
      background: rgba(255,255,255,0.02);
    }
  </style>
</head>
<body>

<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
    <a href="index.html" style="display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-weight:600; font-size:15px; transition:color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">
      <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
      חזרה לחדשות ה-AI
    </a>
    <button onclick="openArchive()" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:6px 12px; font-size:14px; border-radius:6px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;">
      <span class="material-symbols-outlined" style="font-size:18px">archive</span>
      ארכיון פוסטים
    </button>
  </div>
  <div style="display:flex; justify-content:center; align-items:center; gap:16px; margin-bottom: 30px;">
    <div style="display:flex; flex-direction:column; justify-content:center; line-height:1.1; text-align:right;">
      <span style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:900; font-size:32px; letter-spacing:0.5px; color:#ffffff;">MOH AI</span>
      <span style="font-weight:700; font-size:22px; color:#818cf8;">קהילת מוח</span>
    </div>
    <img src="https://moh-content-engine-2026.pages.dev/logo.jpeg" alt="MOH AI קהילת מוח" style="height:64px; border-radius:50%; mix-blend-mode: screen;" />
  </div>
  <div style="text-align:center; font-size:16px; color:var(--accent); font-weight:700; letter-spacing:1px; margin-top:-20px; margin-bottom:30px;">סטודיו פוסטים 🚀</div>
  
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0 0 16px 0;">הזנת מידע גולמי</h3>
      <button style="background:transparent; color:var(--muted); padding:4px;" onclick="toggleSettings()" title="הגדרות API">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <label>Google Gemini API Key (נשמר רק בדפדפן שלך)</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="localStorage.setItem('gemini_api_key', this.value.trim()); loadModels();" />
      <p style="font-size:12px; color:var(--muted); margin-top:-10px; margin-bottom:20px;">
        המפתח אינו נשלח לשום שרת, הוא נשמר ב-Local Storage של הדפדפן.
      </p>
    </div>

    <div style="display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;">
        <label>סגנון הפוסט (טון דיבור):</label>
        <select id="postTone">
          <option value="טכנולוגי, מלהיב אבל מקצועי ואמין">🚀 טכנולוגי ומלהיב (ברירת מחדל)</option>
          <option value="רשמי, ייצוגי ומכובד. מתאים לדיוור רשמי או להנהלה">👔 רשמי וייצוגי</option>
          <option value="קצר מאוד, קולע, רק השורה התחתונה בנקודות">⚡ קצר וקולע (בולטס)</option>
          <option value="פשוט מאוד, מסביר מושגים טכנולוגיים מורכבים במילים פשוטות לקהל הרחב">👶 הסבר ברור לפשוטים</option>
        </select>
      </div>
      <div style="flex:1; min-width:200px;">
        <label>מודל AI:</label>
        <select id="modelSelect" onchange="localStorage.setItem('gemini_selected_model', this.value)">
          <option value="models/gemini-1.5-flash">Gemini 1.5 Flash (מהיר)</option>
          <option value="models/gemini-1.5-pro">Gemini 1.5 Pro (חכם)</option>
        </select>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px;">
      <label style="margin:0;">תוכן גולמי (טקסט או קישור):</label>
      <button onclick="scrapeUrl()" style="padding:4px 10px; font-size:12px; border-radius:6px; background:rgba(96,165,250,0.15); color:var(--accent); border:1px solid rgba(96,165,250,0.3);">
        <span class="material-symbols-outlined" style="font-size:14px;">download</span> קרא מקישור
      </button>
    </div>
    <textarea id="rawContent" rows="5" placeholder="הדבק כאן טקסט ארוך, או שים קישור ולחץ 'קרא מקישור'..."></textarea>
    
    <label>לינק לתמונה / וידאו (אופציונלי):</label>
    <input type="text" id="mediaUrl" placeholder="https://..." />
    
    <label>או העלה תמונה מהמחשב (ה-AI ינתח אותה):</label>
    <input type="file" id="imageInput" accept="image/*" style="margin-bottom:16px; background:var(--surface);" />
    <img id="imagePreview" style="max-width:100%; max-height:200px; display:none; border-radius:8px; margin-bottom:16px;" />

    <button onclick="generatePost()" id="generateBtn">
      <span class="material-symbols-outlined">auto_awesome</span>
      שכתב והכן פוסט
      <div class="loader" id="loader"></div>
    </button>
  </div>

  <div class="card" id="outputCard" style="display:none;">
    <h3 style="margin:0 0 16px 0;">תצוגה מקדימה (WhatsApp)</h3>
    
    <!-- תמונה שנוצרה אוטומטית -->
    <div id="aiImageSection" style="display:none; margin-bottom:16px; position:relative;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <span style="font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px;">
          <span class="material-symbols-outlined" style="font-size:14px;">auto_awesome</span>
          תמונה שנוצרה על ידי AI — לחץ X למחיקה
        </span>
        <div style="display:flex; gap:8px;">
          <button onclick="downloadAiImage()" title="הורד תמונה" style="background:rgba(96,165,250,0.1); color:var(--accent); border:1px solid rgba(96,165,250,0.3); padding:4px 10px; font-size:12px; border-radius:6px;">
            <span class="material-symbols-outlined" style="font-size:14px;">download</span>
          </button>
          <button onclick="removeAiImage()" title="הסר תמונה" style="background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.3); padding:4px 10px; font-size:12px; border-radius:6px;">
            <span class="material-symbols-outlined" style="font-size:14px;">close</span>
          </button>
        </div>
      </div>
      <div id="aiImageLoader" style="height:200px; background:var(--card); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; gap:8px;">
        <div class="loader" style="display:inline-block;"></div>
        מייצר תמונה מתאימה...
      </div>
      <img id="aiImage" style="width:100%; max-height:300px; object-fit:cover; border-radius:10px; display:none;" alt="תמונה שנוצרה על ידי AI" />
    </div>

    <div class="preview-box">
      <div class="msg-bubble" id="postOutput" contenteditable="true" title="ניתן לערוך את הטקסט ישירות כאן"></div>
    </div>

    <div style="margin-top:20px; display:flex; gap:12px; flex-wrap:wrap;">
      <button style="background:var(--card); color:var(--text); border:1px solid var(--border);" onclick="copyToClipboard()">
        <span class="material-symbols-outlined">content_copy</span>
        העתק טקסט
      </button>
      <button class="btn-save-draft" onclick="savePostDraft()" style="background:rgba(96,165,250,0.1); color:var(--accent); border:1px solid rgba(96,165,250,0.3); cursor:pointer;">
        <span class="material-symbols-outlined">save</span>
        שמור נוסח
      </button>
      <button class="btn-wa" onclick="shareToWhatsApp()">
        <span class="material-symbols-outlined">send</span>
        שגר לוואטסאפ
      </button>
    </div>
  </div>

</div>

<!-- רכיבי ארכיון וטואוסט -->
<div class="archive-overlay" id="archiveOverlay" onclick="closeArchive()"></div>
<div class="archive-drawer" id="archiveDrawer">
  <div class="archive-header">
    <h3>ארכיון פוסטים 📂</h3>
    <button class="archive-close-btn" onclick="closeArchive()" title="סגור">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <div class="archive-content" id="archiveItems">
    <!-- הפוסטים ייטענו לכאן בצורה דינמית -->
  </div>
</div>

<div class="toast" id="toast">
  <span class="material-symbols-outlined toast-icon">check_circle</span>
  <span class="toast-text">נשמר בהצלחה!</span>
</div>

<script>
  // טעינת מפתח API מהשמירה בדפדפן
  window.onload = async () => {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
      await loadModels();
      const savedModel = localStorage.getItem('gemini_selected_model');
      if (savedModel) {
        const select = document.getElementById('modelSelect');
        if (select && [...select.options].some(o => o.value === savedModel)) {
          select.value = savedModel;
        }
      }
    } else {
      document.getElementById('settingsPanel').style.display = 'block';
    }

    const params = new URLSearchParams(window.location.search);
    const urlParam = params.get('url');
    if (urlParam) {
      document.getElementById('rawContent').value = urlParam;
      // Auto-populate YouTube thumbnail
      const ytMatch = urlParam.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        document.getElementById('mediaUrl').value = `https://img.youtube.com/vi/${ytMatch[1]}/maxresdefault.jpg`;
      }
      setTimeout(scrapeUrl, 500);
    }
  }

  async function loadModels() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) return;
    const select = document.getElementById('modelSelect');
    if (!select) return;
    
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const data = await res.json();
      if (data && data.models) {
        const availableModels = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));
        
        const currentVal = select.value;
        select.innerHTML = '';
        
        availableModels.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.name;
          let displayName = m.displayName || m.name.replace('models/', '');
          opt.textContent = displayName;
          select.appendChild(opt);
        });
        
        if (currentVal && availableModels.some(m => m.name === currentVal)) {
          select.value = currentVal;
        } else {
          // Select flash model by default, preferably a newer one (2.5 -> 2.0 -> 1.5)
          const defaultOpt = availableModels.find(m => m.name.includes('gemini-2.5-flash')) ||
                             availableModels.find(m => m.name.includes('gemini-2.0-flash')) ||
                             availableModels.find(m => m.name.includes('gemini-1.5-flash')) ||
                             availableModels.find(m => m.name.includes('flash')) ||
                             availableModels[0];
          if (defaultOpt) {
            select.value = defaultOpt.name;
            localStorage.setItem('gemini_selected_model', defaultOpt.name);
          }
        }
      }
    } catch (e) {
      console.error('Error loading models:', e);
    }
  }

  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  }

  const imageInput = document.getElementById('imageInput');
  const imagePreview = document.getElementById('imagePreview');

  imageInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imagePreview.src = e.target.result;
        imagePreview.style.display = 'block';
      }
      reader.readAsDataURL(this.files[0]);
    } else {
      imagePreview.style.display = 'none';
      imagePreview.src = '';
    }
  });

  async function generatePost() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const rawContent = document.getElementById('rawContent').value.trim();
    const mediaUrl = document.getElementById('mediaUrl').value.trim();
    const file = imageInput.files[0];

    if (!apiKey) {
      alert("אנא הזן מפתח Gemini API בהגדרות (סמל גלגל השיניים).");
      document.getElementById('settingsPanel').style.display = 'block';
      return;
    }
    if (!rawContent && !file) {
      alert("אנא הזן תוכן, קישור או העלה תמונה כדי שנוכל לייצר את הפוסט.");
      return;
    }

    // שמירת המפתח לעתיד
    localStorage.setItem('gemini_api_key', apiKey);

    const btn = document.getElementById('generateBtn');
    const loader = document.getElementById('loader');
    
    btn.disabled = true;
    loader.style.display = 'inline-block';

    const tone = document.getElementById('postTone').value;
    const prompt = `
אתה כותב תוכן מקצועי לקבוצת וואטסאפ איכותית בשם "AI Pulse - עדכוני בינה מלאכותית".
המטרה שלך היא לקחת את המידע הגולמי הבא ולשכתב אותו לפוסט וואטסאפ איכותי.

הנחיות:
1. פתח בכותרת קליטה עם אימוג'י רלוונטי.
2. קריאות: השתמש בפסקאות קצרות או בולטים כדי שיהיה נוח לקרוא בנייד.
3. סגנון וטון דיבור: ${tone}.
4. אל תמציא מידע שלא קיים בטקסט או בידע הכללי שלך על הנושא.
5. שים לב להדגשות (כוכביות *כמו בוואטסאפ*) איפה שצריך להדגיש מילים חשובות.
6. בסוף הפוסט, הוסף שורה להנעה לפעולה או קישור אם יש.
7. חשוב מאוד: אל תוסיף שאלות כגון "מה דעתכם?", "ספרו לנו בתגובות", "נשמח לשמוע" או כל שאלה מעין זו.

המידע הגולמי מהמשתמש:
"""
${rawContent}
"""

${mediaUrl ? `* שים לב: המשתמש גם צירף קישור למדיה: ${mediaUrl} (שלב את הקישור בפוסט)` : ""}

החזר רק את טקסט הפוסט עצמו בלבד. אל תוסיף כל הקדמה כגון "בוודאי!", "הנה הפוסט:", "כמובן!", או כל הסבר אחר לפני הפוסט. אל תוסיף שום טקסט אחרי הפוסט.
`;

    // הכנת התמונה אם הועלתה
    let parts = [{ text: prompt }];
    if (file) {
      const base64Data = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const result = reader.result;
          resolve(result.substring(result.indexOf(',') + 1));
        };
        reader.readAsDataURL(file);
      });
      
      parts.push({
        inline_data: {
          mime_type: file.type,
          data: base64Data
        }
      });
    }

    try {
      const modelSelect = document.getElementById('modelSelect');
      const selectedModel = modelSelect ? modelSelect.value : 'models/gemini-1.5-flash';

      // נוודא ששם המודל לא מכיל את הקידומת models/ פעמיים
      const modelId = selectedModel.replace('models/', '');
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`;
      
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{ parts: parts }],
          generationConfig: { temperature: 0.7 }
        })
      });

      const data = await response.json();
      
      if (data.error) {
        throw new Error(data.error.message);
      }

      const postText = data.candidates[0].content.parts[0].text.trim();
      
      document.getElementById('postOutput').textContent = postText;
      document.getElementById('outputCard').style.display = 'block';

      // איפוס מזהה פוסט קיים ליצירת פוסט חדש בארכיון
      currentPostId = Date.now().toString();
      savePostToArchive(false);

      // יצירת תמונה אוטומטית
      generateAiImage(postText, rawContent, apiKey);
      
    } catch (err) {
      alert("שגיאה ביצירת הפוסט: " + err.message);
    } finally {
      btn.disabled = false;
      loader.style.display = 'none';
    }
  }

  async function generateAiImage(postText, rawContent, apiKey) {
    const section = document.getElementById('aiImageSection');
    const loaderEl = document.getElementById('aiImageLoader');
    const imgEl = document.getElementById('aiImage');

    section.style.display = 'block';
    loaderEl.style.display = 'flex';
    imgEl.style.display = 'none';

    try {
      // שאל את Gemini לתיאור תמונה קצר באנגלית
      const promptReq = `Based on this WhatsApp post, write a SHORT image generation prompt in English (max 15 words, no quotes). The image should be professional, modern, suitable for a tech news post. Post:\n${postText.substring(0, 500)}`;
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptReq }] }], generationConfig: { temperature: 0.6, maxOutputTokens: 60 } })
      });
      const d = await res.json();
      let imagePrompt = d.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || 'modern technology artificial intelligence digital innovation professional';
      // הסר מרכאות אם יש
      imagePrompt = imagePrompt.replace(/["']/g, '').substring(0, 200);
      console.log('Image prompt:', imagePrompt);

      // צור תמונה דרך Pollinations.ai
      const seed = Math.floor(Math.random() * 9999);
      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imagePrompt)}?width=800&height=450&seed=${seed}&nologo=true&enhance=true`;

      imgEl.onload = () => {
        loaderEl.style.display = 'none';
        imgEl.style.display = 'block';
        imgEl.dataset.src = imgUrl;
        // עדכון אוטומטי של הפוסט בארכיון עם התמונה שנוצרה
        savePostToArchive(false);
      };
      imgEl.onerror = () => {
        section.style.display = 'none';
      };
      imgEl.src = imgUrl;

    } catch(e) {
      section.style.display = 'none';
      console.warn('Image generation failed:', e);
    }
  }

  function removeAiImage() {
    document.getElementById('aiImageSection').style.display = 'none';
    savePostToArchive(false);
    showToast("התמונה הוסרה מהפוסט");
  }

  function downloadAiImage() {
    const img = document.getElementById('aiImage');
    if (!img.src) return;
    const a = document.createElement('a');
    a.href = img.src;
    a.download = 'ai-post-image.jpg';
    a.target = '_blank';
    a.click();
  }

  function copyToClipboard() {
    const text = document.getElementById('postOutput').textContent;
    navigator.clipboard.writeText(text).then(() => {
      showToast("הטקסט הועתק ללוח!");
    }).catch(err => {
      alert("שגיאה בהעתקה.");
    });
  }

  function shareToWhatsApp() {
    const text = document.getElementById('postOutput').textContent;
    savePostToArchive(true); // סמן כנשלח בארכיון
    const waUrl = 'https://wa.me/?text=' + encodeURIComponent(text);
    window.open(waUrl, '_blank');
  }

  // --- מערכת ארכיון וניהול פוסטים ---
  let currentPostId = null;

  function getToneLabel(toneValue) {
    const options = {
      "טכנולוגי, מלהיב אבל מקצועי ואמין": "🚀 טכנולוגי ומלהיב",
      "רשמי, ייצוגי ומכובד. מתאים לדיוור רשמי או להנהלה": "👔 רשמי וייצוגי",
      "קצר מאוד, קולע, רק השורה התחתונה בנקודות": "⚡ קצר וקולע",
      "פשוט מאוד, מסביר מושגים טכנולוגיים מורכבים במילים פשוטות לקהל הרחב": "👶 הסבר פשוט"
    };
    return options[toneValue] || toneValue || "🚀 טכנולוגי ומלהיב";
  }

  function savePostToArchive(isSent = false) {
    const postOutput = document.getElementById('postOutput');
    if (!postOutput || !postOutput.textContent.trim()) return;

    const text = postOutput.textContent.trim();
    const tone = document.getElementById('postTone').value;
    
    // בדיקת תמונה קיימת
    const imgSection = document.getElementById('aiImageSection');
    const imgEl = document.getElementById('aiImage');
    let imageSrc = null;
    if (imgSection && imgSection.style.display !== 'none' && imgEl && imgEl.style.display !== 'none' && imgEl.src) {
      imageSrc = imgEl.src;
    }

    let archive = JSON.parse(localStorage.getItem('ai_news_archive') || '[]');
    
    if (currentPostId) {
      const index = archive.findIndex(p => p.id === currentPostId);
      if (index !== -1) {
        archive[index].text = text;
        archive[index].tone = tone;
        archive[index].imageSrc = imageSrc;
        if (isSent) {
          archive[index].sent = true;
        }
        localStorage.setItem('ai_news_archive', JSON.stringify(archive));
        renderArchive();
        return;
      }
    }

    // יצירת פוסט חדש בארכיון
    const now = new Date();
    const formattedDate = now.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + 
                          now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    
    const newPost = {
      id: currentPostId || Date.now().toString(),
      text: text,
      tone: tone,
      imageSrc: imageSrc,
      date: formattedDate,
      sent: isSent
    };
    
    currentPostId = newPost.id;
    archive.unshift(newPost);
    localStorage.setItem('ai_news_archive', JSON.stringify(archive));
    renderArchive();
  }

  function savePostDraft() {
    savePostToArchive(false);
    showToast("הנוסח נשמר בארכיון!");
  }

  function openArchive() {
    document.getElementById('archiveOverlay').classList.add('show');
    document.getElementById('archiveDrawer').classList.add('open');
    renderArchive();
  }

  function closeArchive() {
    document.getElementById('archiveOverlay').classList.remove('show');
    document.getElementById('archiveDrawer').classList.remove('open');
  }

  function renderArchive() {
    const container = document.getElementById('archiveItems');
    if (!container) return;
    
    const archive = JSON.parse(localStorage.getItem('ai_news_archive') || '[]');
    
    if (archive.length === 0) {
      container.innerHTML = `
        <div style="text-align:center; padding:40px 20px; color:var(--muted); font-size:14px;">
          <span class="material-symbols-outlined" style="font-size:48px; margin-bottom:12px; display:block; opacity:0.5;">archive</span>
          אין פוסטים בארכיון עדיין.
        </div>
      `;
      return;
    }
    
    container.innerHTML = archive.map(post => {
      const toneLabel = getToneLabel(post.tone);
      const badgeClass = post.sent ? 'sent' : 'draft';
      const badgeText = post.sent ? 'שוגר' : 'טיוטה';
      const badgeIcon = post.sent ? 'send' : 'description';
      
      return `
        <div class="archive-item" data-id="${post.id}">
          <div class="archive-item-meta">
            <span>${post.date}</span>
            <span class="status-badge ${badgeClass}">
              <span class="material-symbols-outlined" style="font-size:12px; vertical-align:middle;">${badgeIcon}</span>
              ${badgeText}
            </span>
          </div>
          <div style="font-size:12px; font-weight:700; color:var(--accent); margin-bottom:8px;">סגנון: ${toneLabel}</div>
          
          ${post.imageSrc ? `<img src="${post.imageSrc}" class="archive-item-image" alt="תמונת פוסט" />` : ''}
          
          <div class="archive-item-text">${escapeHtml(post.text)}</div>
          
          <div class="archive-item-actions">
            <button style="background:var(--accent); color:#000;" onclick="loadPostFromArchive('${post.id}')" title="טען לסטודיו">
              <span class="material-symbols-outlined" style="font-size:14px; vertical-align:middle;">open_in_new</span>
              טען
            </button>
            <button style="background:var(--card); color:var(--text); border:1px solid var(--border);" onclick="copyArchiveText('${post.id}')" title="העתק טקסט">
              <span class="material-symbols-outlined" style="font-size:14px; vertical-align:middle;">content_copy</span>
            </button>
            ${post.imageSrc ? `
              <button style="background:var(--card); color:var(--text); border:1px solid var(--border);" onclick="downloadArchiveImage('${post.imageSrc}')" title="הורד תמונה">
                <span class="material-symbols-outlined" style="font-size:14px; vertical-align:middle;">download</span>
              </button>
            ` : ''}
            <button style="background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.3);" onclick="deleteFromArchive('${post.id}')" title="מחק">
              <span class="material-symbols-outlined" style="font-size:14px; vertical-align:middle;">delete</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function loadPostFromArchive(id) {
    const archive = JSON.parse(localStorage.getItem('ai_news_archive') || '[]');
    const post = archive.find(p => p.id === id);
    if (!post) return;

    // טעינת טקסט
    document.getElementById('postOutput').textContent = post.text;
    document.getElementById('outputCard').style.display = 'block';
    
    // הגדרת סגנון
    const toneSelect = document.getElementById('postTone');
    if (toneSelect && [...toneSelect.options].some(o => o.value === post.tone)) {
      toneSelect.value = post.tone;
    }

    // טעינת תמונה אם קיימת
    const section = document.getElementById('aiImageSection');
    const loaderEl = document.getElementById('aiImageLoader');
    const imgEl = document.getElementById('aiImage');

    if (post.imageSrc) {
      section.style.display = 'block';
      loaderEl.style.display = 'none';
      imgEl.style.display = 'block';
      imgEl.src = post.imageSrc;
      imgEl.dataset.src = post.imageSrc;
    } else {
      section.style.display = 'none';
      imgEl.src = '';
      imgEl.style.display = 'none';
    }

    currentPostId = id;
    closeArchive();
    showToast("הפוסט נטען מחדש לסטודיו!");
    
    // גלילה חלקה לתצוגה המקדימה
    document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
  }

  function copyArchiveText(id) {
    const archive = JSON.parse(localStorage.getItem('ai_news_archive') || '[]');
    const post = archive.find(p => p.id === id);
    if (!post) return;

    navigator.clipboard.writeText(post.text).then(() => {
      showToast("הטקסט הועתק ללוח!");
    }).catch(err => {
      alert("שגיאה בהעתקה.");
    });
  }

  function downloadArchiveImage(url) {
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ai-archive-image.jpg';
    a.target = '_blank';
    a.click();
  }

  function deleteFromArchive(id) {
    if (!confirm("האם אתה בטוח שברצונך למחוק פוסט זה מהארכיון?")) return;

    let archive = JSON.parse(localStorage.getItem('ai_news_archive') || '[]');
    archive = archive.filter(p => p.id !== id);
    localStorage.setItem('ai_news_archive', JSON.stringify(archive));
    
    if (currentPostId === id) {
      currentPostId = null;
    }
    
    renderArchive();
    showToast("הפוסט נמחק מהארכיון", "delete");
  }

  function showToast(message, icon = 'check_circle') {
    const toast = document.getElementById('toast');
    toast.querySelector('.toast-text').textContent = message;
    toast.querySelector('.toast-icon').textContent = icon;
    toast.style.display = 'flex';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 3000);
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function extractTextFromHtml(html) {
    // הסרת סקריפטים, סגנונות ותגיות HTML
    let text = html
      .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
      .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
      .replace(/<nav[^>]*>[\s\S]*?<\/nav>/gi, '')
      .replace(/<header[^>]*>[\s\S]*?<\/header>/gi, '')
      .replace(/<footer[^>]*>[\s\S]*?<\/footer>/gi, '')
      .replace(/<aside[^>]*>[\s\S]*?<\/aside>/gi, '')
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/p>/gi, '\n')
      .replace(/<\/div>/gi, '\n')
      .replace(/<\/h[1-6]>/gi, '\n')
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
    return text.substring(0, 5000);
  }

  async function tryProxy(proxyUrl) {
    const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res;
  }

  async function scrapeUrl() {
    const ta = document.getElementById('rawContent');
    const urlMatch = ta.value.match(/https?:\/\/[^\s]+/);
    if (!urlMatch) {
      alert("לא זוהה קישור תקין בתיבת התוכן. אנא הדבק קישור מלא (כולל http/https).");
      return;
    }
    // נקה תווים מיוחדים בסוף ה-URL (סוגריים, מקפים וכד')
    const url = urlMatch[0].replace(/[\]\[):;,.\-]+$/, '');
    const encoded = encodeURIComponent(url);

    const proxies = [
      { name: 'our-worker',  fetch: async () => {
          const r = await tryProxy(`/scrape?url=${encoded}`);
          const d = await r.json();
          return d.text || null;
      }},
      { name: 'allorigins',  fetch: async () => {
          const r = await tryProxy(`https://api.allorigins.win/get?url=${encoded}`);
          const d = await r.json();
          return d.contents || null;
      }},
      { name: 'corsproxy',   fetch: async () => {
          const r = await tryProxy(`https://corsproxy.io/?${encoded}`);
          return await r.text();
      }},
      { name: 'codetabs',    fetch: async () => {
          const r = await tryProxy(`https://api.codetabs.com/v1/proxy?quest=${encoded}`);
          return await r.text();
      }},
      { name: 'thingproxy', fetch: async () => {
          const r = await tryProxy(`https://thingproxy.freeboard.io/fetch/${url}`);
          return await r.text();
      }},
    ];

    const errorPageSignals = ['הודעת שגיאה', 'captcha', 'access denied', '403 forbidden', 'bot detected', 'please enable javascript', 'שגיאה 4'];

    function isErrorPage(text) {
      const lower = text.toLowerCase();
      return errorPageSignals.some(sig => lower.includes(sig.toLowerCase())) || text.length < 150;
    }

    for (let i = 0; i < proxies.length; i++) {
      const proxy = proxies[i];
      ta.value = `מנסה לקרוא את הכתבה (ניסיון ${i+1}/${proxies.length} — ${proxy.name})...`;
      try {
        const html = await proxy.fetch();
        if (html && html.length > 200) {
          const text = extractTextFromHtml(html);
          if (text.length > 100) {
            ta.value = `[תוכן מחולץ מ-${url}]:\n\n` + text;
            return;
          }
        }
      } catch(e) {
        console.warn(`Proxy ${proxy.name} failed:`, e.message);
      }
    }

    // כל ה-proxies נכשלו — ה-AI ינסה על פי הקישור
    ta.value = url + "\n\n(האתר חוסם גישה אוטומטית. ה-AI יסתמך על הקישור עצמו ועל ידע כללי על הנושא.)";
  }
