<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Pulse — סטודיו פוסטים</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0b0e15;
      --surface: #111520;
      --card: rgba(255,255,255,0.035);
      --border: rgba(255,255,255,0.07);
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #60a5fa;
      --green: #25d366;
      --font-body: 'Assistant', sans-serif;
      --radius: 12px;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 800px;
      padding: 40px 20px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      text-align: center;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #e2e8f0, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 16px;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    textarea:focus, input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(96,165,250,0.2);
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    button:hover {
      background: #3b82f6;
      color: #fff;
    }
    .btn-wa {
      background: var(--green);
      color: #fff;
    }
    .btn-wa:hover {
      background: #1ebc5c;
    }
    .preview-box {
      background: #e5ddd5;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }
    .msg-bubble {
      background: #ffffff;
      color: #111;
      padding: 12px 16px;
      border-radius: 12px;
      border-top-right-radius: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .loader {
      display: none;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .settings-panel {
      display: none;
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" style="display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; margin-bottom:16px; font-weight:600; font-size:15px; transition:color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">
    <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
    חזרה לחדשות ה-AI
  </a>
  <h1 style="margin-top:0;">AI Pulse — סטודיו פוסטים 🚀</h1>
  
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0 0 16px 0;">הזנת מידע גולמי</h3>
      <button style="background:transparent; color:var(--muted); padding:4px;" onclick="toggleSettings()" title="הגדרות API">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <label>Google Gemini API Key (נשמר רק בדפדפן שלך)</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />
      <p style="font-size:12px; color:var(--muted); margin-top:-10px; margin-bottom:20px;">
        המפתח אינו נשלח לשום שרת, הוא נשמר ב-Local Storage של הדפדפן.
      </p>
    </div>

    <label>תוכן / לינק לכתבה / רעיונות:</label>
    <textarea id="rawContent" rows="5" placeholder="הדבק כאן מידע, קישור, או כתוב לי בנקודות על מה הפוסט..."></textarea>
    
    <label>לינק לתמונה / וידאו (אופציונלי):</label>
    <input type="text" id="mediaUrl" placeholder="https://..." />
    
    <label>או העלה תמונה מהמחשב (ה-AI ינתח אותה):</label>
    <input type="file" id="imageInput" accept="image/*" style="margin-bottom:16px; background:var(--surface);" />
    <img id="imagePreview" style="max-width:100%; max-height:200px; display:none; border-radius:8px; margin-bottom:16px;" />

    <button onclick="generatePost()" id="generateBtn">
      <span class="material-symbols-outlined">auto_awesome</span>
      שכתב והכן פוסט
      <div class="loader" id="loader"></div>
    </button>
  </div>

  <div class="card" id="outputCard" style="display:none;">
    <h3 style="margin:0 0 16px 0;">תצוגה מקדימה (WhatsApp)</h3>
    
    <div class="preview-box">
      <div class="msg-bubble" id="postOutput"></div>
    </div>

    <div style="margin-top:20px; display:flex; gap:12px;">
      <button class="btn-wa" onclick="copyToClipboard()">
        <span class="material-symbols-outlined">content_copy</span>
        העתק פוסט לוואטסאפ
      </button>
    </div>
  </div>

</div>

<script>
  // טעינת מפתח API מהשמירה בדפדפן
  window.onload = () => {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
    } else {
      document.getElementById('settingsPanel').style.display = 'block';
    }
  }

  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  }

  const imageInput = document.getElementById('imageInput');
  const imagePreview = document.getElementById('imagePreview');

  imageInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imagePreview.src = e.target.result;
        imagePreview.style.display = 'block';
      }
      reader.readAsDataURL(this.files[0]);
    } else {
      imagePreview.style.display = 'none';
      imagePreview.src = '';
    }
  });

  async function generatePost() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const rawContent = document.getElementById('rawContent').value.trim();
    const mediaUrl = document.getElementById('mediaUrl').value.trim();
    const file = imageInput.files[0];

    if (!apiKey) {
      alert("אנא הזן מפתח Gemini API בהגדרות (סמל גלגל השיניים).");
      document.getElementById('settingsPanel').style.display = 'block';
      return;
    }
    if (!rawContent && !file) {
      alert("אנא הזן תוכן, קישור או העלה תמונה כדי שנוכל לייצר את הפוסט.");
      return;
    }

    // שמירת המפתח לעתיד
    localStorage.setItem('gemini_api_key', apiKey);

    const btn = document.getElementById('generateBtn');
    const loader = document.getElementById('loader');
    
    btn.disabled = true;
    loader.style.display = 'inline-block';

    const prompt = `
אתה כותב תוכן מקצועי לקבוצת וואטסאפ איכותית בשם "AI Pulse - עדכוני בינה מלאכותית".
המטרה שלך היא לקחת את המידע הגולמי הבא ולשכתב אותו לפוסט וואטסאפ קצר, קליט, מלהיב וקריא מאוד.

הנחיות:
1. פתח בכותרת קליטה עם אימוג'י רלוונטי.
2. כתוב בנקודות (בולטים) או פסקאות קצרות כדי שיהיה קל לקרוא בנייד.
3. סגנון: טכנולוגי, מלהיב אבל מקצועי ואמין. 
4. אל תמציא מידע שלא קיים בטקסט או בידע הכללי שלך על הנושא.
5. שים לב להדגשות (כוכביות *כמו בוואטסאפ*) איפה שצריך להדגיש מילים חשובות.
6. בסוף הפוסט, הוסף שורה להנעה לפעולה או קישור אם יש.

המידע הגולמי מהמשתמש:
"""
${rawContent}
"""

${mediaUrl ? `* שים לב: המשתמש גם צירף קישור למדיה: ${mediaUrl} (שלב את הקישור בפוסט)` : ""}
`;

    // הכנת התמונה אם הועלתה
    let parts = [{ text: prompt }];
    if (file) {
      const base64Data = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const result = reader.result;
          resolve(result.substring(result.indexOf(',') + 1));
        };
        reader.readAsDataURL(file);
      });
      
      parts.push({
        inline_data: {
          mime_type: file.type,
          data: base64Data
        }
      });
    }

    try {
      // דינאמית מוצאים את המודל הנכון שנתמך במפתח של המשתמש כדי למנוע שגיאות
      const modelsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const modelsData = await modelsRes.json();
      
      let selectedModel = 'models/gemini-1.5-flash'; // ברירת מחדל
      if (modelsData && modelsData.models) {
        // מחפשים קודם את 1.5 פלאש, ואם לא, כל מודל שתומך בתוכן
        const availableModels = modelsData.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));
        const flashModel = availableModels.find(m => m.name.includes('gemini-1.5-flash'));
        const proModel = availableModels.find(m => m.name.includes('gemini-1.5-pro'));
        const fallbackModel = availableModels.find(m => m.name.includes('gemini'));
        
        selectedModel = flashModel ? flashModel.name : (proModel ? proModel.name : (fallbackModel ? fallbackModel.name : selectedModel));
      }

      // נוודא ששם המודל לא מכיל את הקידומת models/ פעמיים
      const modelId = selectedModel.replace('models/', '');
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`;
      
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{ parts: parts }],
          generationConfig: { temperature: 0.7 }
        })
      });

      const data = await response.json();
      
      if (data.error) {
        throw new Error(data.error.message);
      }

      const postText = data.candidates[0].content.parts[0].text.trim();
      
      document.getElementById('postOutput').textContent = postText;
      document.getElementById('outputCard').style.display = 'block';
      
    } catch (err) {
      alert("שגיאה ביצירת הפוסט: " + err.message);
    } finally {
      btn.disabled = false;
      loader.style.display = 'none';
    }
  }

  function copyToClipboard() {
    const text = document.getElementById('postOutput').textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert("הפוסט הועתק בהצלחה! אפשר להדביק בוואטסאפ.");
    }).catch(err => {
      alert("שגיאה בהעתקה.");
    });
  }
</script>
</body>
</html>
